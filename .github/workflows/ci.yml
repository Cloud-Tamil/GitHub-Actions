name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# ------------------------------------------------------------
# Permissions
# ------------------------------------------------------------
permissions:
  contents: read
  packages: read
  security-events: write

# ------------------------------------------------------------
# Cancel older CI runs for the same branch/PR
# ------------------------------------------------------------
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========== JOB 1: Lint (fastest — fails first) ==========
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
      - run: npm run lint

  # ========== JOB 2: Test with Services (Postgres + Redis) ==========
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [20, 22]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: taskdb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test -- --coverage
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: taskdb_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.node-version == 20
        with:
          name: coverage-report
          path: coverage/

  # ========== JOB 3: Security Scan (Trivy) ==========
  security:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy SARIF Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-scan-sarif
          path: trivy-results.sarif
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
